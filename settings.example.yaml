# s3-viewer settings. Copy to ~/.s3-viewer, or point the S3_VIEWER_SETTINGS env variable at another file.

# HTTP port the API and the UI are served on. Optional, 8000 when absent.
http_port: 8000

# The root level of the tree, in this order. `name` is the S3 bucket name and must be unique.
buckets:
  - name: my-bucket
    endpoint: https://nbg1.your-objectstorage.com
    region: nbg1
    access_key: YOUR_ACCESS_KEY
    secret_key: YOUR_SECRET_KEY

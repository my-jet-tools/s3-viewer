[package]
name = "s3-viewer-ui"
version = "0.1.0"
edition = "2024"

[features]
default = ["web"]
web = ["dioxus/web"]

[dependencies]
# Pinned to the exact version of the `dx` CLI that builds this crate (dx 0.7.10). The CLI and the
# library are two halves of one release - the CLI generates the bundle the runtime expects - so
# letting them drift breaks only at build time.
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-utils = { tag = "0.7.0", git = "https://github.com/MyJetTools/dioxus-utils.git", features = [
    "web",
] }

# HTTP client. Compiles to the browser fetch API under wasm, resolves relative "/api/..." urls
# against the page origin and consumes the shared MyHttpInput models via execute_request.
flurl = { tag = "0.7.0", git = "https://github.com/MyJetTools/fl-url.git" }

# Shared wire models, reused verbatim from the server. NO `server` feature here - the client only
# needs the schema + the FlUrl request builder.
rest-api-shared = { path = "../rest-api-shared" }

serde = { version = "*", features = ["derive"] }
serde_json = { version = "*" }

# Downloads click a detached <a href download> (never navigate the page, so an error answer can not
# replace the app), and a click button reads MouseEvent.detail to ignore the repeat of a double click.
web-sys = { version = "*", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlAnchorElement",
    "Node",
    "MouseEvent",
    "UiEvent",
] }

[build-dependencies]
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }

# NO DWARF IN THE SHIPPED WASM, and it is not a size preference - it is what lets the optimizer run
# at all. `dx build --release --web` hands the module to `wasm-opt`, and binaryen aborts on the debug
# sections rustc emits ("compile unit size was incorrect (this may be an unsupported version of
# DWARF)", SIGABRT). `dx` then still reports the build as successful and ships the un-optimized
# module, so the failure is silent. Debug info in a browser bundle buys nothing anyway.
[profile.release]
strip = "debuginfo"

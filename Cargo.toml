[package]
name = "s3-viewer"
version = "0.1.0"
edition = "2024"

# S3 file viewer: the REST API (this crate) + the Dioxus client-side UI (ui/), built into wwwroot/
# and served by this very process through StaticFilesMiddleware. Standalone tool, no service-sdk.

[dependencies]
my-http-server = { tag = "0.9.0", git = "https://github.com/MyJetTools/my-http-server.git", features = [
    "macros",
    "controllers",
    "static-files",
] }

# Direct because the `MyHttpInput` / `http_route` expansions are rooted at `my_http_utils::`.
# Same tag as rest-api-shared's and my-http-server's, so all three resolve to one copy; `server`
# is what makes the derive emit the sync `parse` the controllers call.
my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git", features = [
    "server",
] }

# Wire models shared verbatim with the wasm UI (which depends on it without features).
rest-api-shared = { path = "rest-api-shared", features = ["server"] }

# `list_objects_v2` (tree levels) and `download_file_as_stream` (downloads) are in tag 0.1.0.
my-s3 = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-s3.git" }

my-logger = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-logger.git" }

# MCP server mounted at /mcp: read-only list_buckets / list_objects tools. Built on the same
# my-http-server 0.9.0 and rust-extensions 0.1.5 as this crate. `my-ai-agent` is direct because the
# `ApplyJsonSchema` derive expands to paths rooted at `my_ai_agent::`.
mcp-server-middleware = { tag = "0.9.0", git = "https://github.com/my-ai-utils/mcp-server-middleware.git" }
my-ai-agent = { tag = "0.1.0", git = "https://github.com/my-ai-utils/my-ai-agent.git", features = [
    "agent",
] }

# `AppStates` (graceful shutdown on SIGINT/SIGTERM). The tag MUST match the one my-http-server, my-logger and my-s3 pin: the
# `ApplicationStates` / `Logger` traits handed to the HTTP server have to be the same traits.
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "with-tokio",
] }

# The `http_route` macro expands to `#[async_trait::async_trait]`, so the crate must be nameable here.
async-trait = "*"
tokio = { version = "*", features = ["full"] }
serde = { version = "*", features = ["derive"] }
serde_yaml = "*"

# build.rs regenerates Dockerfile, .github/workflows/release.yaml and .github/workflows/test.yml.
[build-dependencies]
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }

# ALL lint levels of this crate live here, never as `#![deny]` / `#[allow]` in the sources: a source
# attribute overrides this table, so a crate-level `#![deny(clippy::all)]` would silently re-deny the
# exception below, and a scattered `#[allow]` is invisible from here.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# THE ONE FRAMEWORK-DICTATED EXCEPTION.
# `http_route` makes every action's `handle_request` return `Result<HttpOkResult, HttpFailResult>`
# as is (the generated `HandleHttpRequest` impl returns it verbatim), and `HttpFailResult` is
# `my-http-server`'s type, well over clippy's 128-byte threshold. It can not be boxed on our side.
# Checked by setting this to "warn": the only hits are the `handle_request` fns of
# ListObjectsAction and DownloadObjectAction. Everything below the handlers returns the small
# `S3ViewerError`, so nothing of ours hides behind this line. Delete it the day `HttpFailResult`
# gets smaller upstream.
result_large_err = "allow"
